<div class="terminal-page-wrapper">
  <!-- Terminal Outer Frame -->
  <div class="terminal-shell" id="term-shell">
    <!-- Title Bar -->
    <div class="term-titlebar">
      <div class="term-controls">
        <span class="term-btn term-btn-red" title="Close / Reset" onclick="resetTerminal()"></span>
        <span class="term-btn term-btn-yellow" title="Minimize / Clear" onclick="clearTerminal()"></span>
        <span class="term-btn term-btn-green" title="Maximize / Fullscreen" onclick="toggleFullscreen()"></span>
      </div>

      <div class="term-header-info">
        <span class="term-shield-icon">&#x1F6E1;</span>
        <span class="term-title-text" id="term-title-text">SANDBOX_JAIL // SECURE_RUNTIME [ISOLATED]</span>
      </div>

      <div class="term-actions">
        <!-- Shell Mode Toggle -->
        <div class="term-mode-selector">
          <label for="shell-mode-select">SHELL:</label>
          <select id="shell-mode-select" onchange="changeShellMode(this.value)">
            <option value="cmd">CMD</option>
            <option value="bash" selected>BASH</option>
            <option value="powershell">POWERSHELL</option>
          </select>
        </div>

        <!-- CRT Effect Toggle -->
        <button class="term-action-btn" id="crt-toggle-btn" onclick="toggleCRT()" title="Toggle Retro CRT Scanlines">
          CRT: OFF
        </button>

        <!-- Theme Selector -->
        <select id="term-theme-select" class="term-select" onchange="changeTermTheme(this.value)" title="Terminal Color Palette">
          <option value="pitch_black">PITCH BLACK</option>
          <option value="matrix">MATRIX GREEN</option>
          <option value="amber">AMBER PHOSPHOR</option>
          <option value="stark_white">STARK WHITE</option>
        </select>

        <!-- Maximize Button -->
        <button class="term-action-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
          <span id="fullscreen-btn-icon">&#x26F6;</span>
        </button>
      </div>
    </div>

    <!-- Terminal Screen Body -->
    <div class="term-screen" id="term-screen" onclick="focusTerminalInput()">
      <!-- CRT Overlay Effect Layer -->
      <div class="term-crt-scanlines" id="crt-overlay"></div>

      <!-- Terminal Output Area -->
      <div class="term-output" id="term-output">
        <!-- Banner will be rendered by JS -->
      </div>

      <!-- Active Input Line -->
      <div class="term-input-line" id="term-input-line">
        <span class="term-prompt" id="term-prompt"></span>
        <div class="term-input-wrapper">
          <span class="term-input-text" id="term-input-display"></span><span class="term-cursor" id="term-cursor"></span>
          <input type="text" id="term-real-input" class="term-hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
    </div>

    <!-- Terminal Status Bar -->
    <div class="term-statusbar">
      <div class="term-status-left">
        <span class="status-indicator-dot"></span>
        <span id="jail-status-label">JAIL: ACTIVE &bull; BOUNDARY: STRICT &bull; DIR: .</span>
      </div>
      <div class="term-status-right">
        <span id="term-clock"></span> &bull; <span>SANDBOX PROTOCOL v4.2</span>
      </div>
    </div>
  </div>
</div>

<!-- NOTE: sandbox="allow-scripts" without "allow-same-origin" guarantees that the iframe is treated as an opaque origin -->
<!-- It has ZERO access to window.parent, localStorage, sessionStorage, cookies, or host DOM -->
<iframe id="isolated-sandbox-frame" sandbox="allow-scripts" style="display: none;" srcdoc="
<!DOCTYPE html>
<html>
<head><meta charset='utf-8'></head>
<body>
<script>
window.addEventListener('message', function(e) {
  var id = e.data.id;
  var code = e.data.code;
  var logs = [];
  var origLog = console.log;
  var origWarn = console.warn;
  var origError = console.error;

  console.log = function() {
    var args = Array.prototype.slice.call(arguments);
    logs.push({ type: 'log', text: args.map(function(a) {
      return (typeof a === 'object') ? JSON.stringify(a, null, 2) : String(a);
    }).join(' ') });
    origLog.apply(console, arguments);
  };
  console.warn = function() {
    var args = Array.prototype.slice.call(arguments);
    logs.push({ type: 'warn', text: args.map(function(a) {
      return (typeof a === 'object') ? JSON.stringify(a, null, 2) : String(a);
    }).join(' ') });
    origWarn.apply(console, arguments);
  };
  console.error = function() {
    var args = Array.prototype.slice.call(arguments);
    logs.push({ type: 'error', text: args.map(function(a) {
      return (typeof a === 'object') ? JSON.stringify(a, null, 2) : String(a);
    }).join(' ') });
    origError.apply(console, arguments);
  };

  try {
    var result = (function() {
      'use strict';
      return eval(code);
    })();

    var formattedResult = undefined;
    if (result !== undefined) {
      try {
        formattedResult = (typeof result === 'object') ? JSON.stringify(result, null, 2) : String(result);
      } catch(err) {
        formattedResult = String(result);
      }
    }

    e.source.postMessage({ id: id, success: true, result: formattedResult, logs: logs }, '*');
  } catch(err) {
    e.source.postMessage({ id: id, success: false, error: err.name + ': ' + err.message, logs: logs }, '*');
  } finally {
    console.log = origLog;
    console.warn = origWarn;
    console.error = origError;
  }
});
</script>
</body>
</html>

  // Strict List Directory Handler
  function handleListDir(target) {
    if (target) {
      const cleanTarget = target.trim().replace(/^\.\//, "").replace(/\/$/, "");
      if (cleanTarget === ".." || cleanTarget.startsWith("/") || cleanTarget.startsWith("\\")) {
        printLine("stderr", "PERMISSION DENIED: Jail boundary violation. Traversal outside '.' prohibited.");
        return;
      }
      if (cleanTarget === "." || cleanTarget === "") {
        const dirObj = currentDir ? VFS["."].files[currentDir].files : VFS["."].files;
        renderDirListing(dirObj);
        return;
      }
      const targetObj = (currentDir && VFS["."].files[currentDir].files[cleanTarget]) 
        ? VFS["."].files[currentDir].files[cleanTarget] 
        : VFS["."].files[cleanTarget];

      if (targetObj && targetObj.type === "dir") {
        if (targetObj.protected && !isElevated) {
          printLine("stderr", `ACCESS DENIED: Directory '${cleanTarget}' is strictly password-protected.\nType 'auth' to unlock.`);
          return;
        }
        renderDirListing(targetObj.files);
        return;
      } else {
        printLine("stderr", `Directory not found: '${target}'`);
        return;
      }
    }

    // No target -> list current directory
    const dirObj = currentDir ? VFS["."].files[currentDir].files : VFS["."].files;
    renderDirListing(dirObj);
  }

  // Strict CD Handler
  function handleCd(target) {
    if (!target || target === "." || target === "./") {
      printLine("dim", "[CD] Directory maintained at .");
      return;
    }

    const clean = target.trim().replace(/\/$/, "");

    // Anti-traversal check
    if (clean === ".." || clean === "../") {
      if (currentDir !== "") {
        currentDir = "";
        printLine("dim", "[CD] Context returned to .");
        return;
      } else {
        printLine("stderr", "PERMISSION DENIED: Jail boundary violation. Root traversal prohibited.");
        return;
      }
    }

    if (clean.startsWith("..") || clean.startsWith("/") || clean.startsWith("\\") || clean === "~") {
      printLine("stderr", "PERMISSION DENIED: Jail boundary violation. Root traversal prohibited.");
      return;
    }

    const simpleName = clean.replace(/^\.\//, "");
    if (currentDir === "") {
      if (VFS["."].files[simpleName] && VFS["."].files[simpleName].type === "dir") {
        if (VFS["."].files[simpleName].protected && !isElevated) {
          printLine("stderr", `ACCESS DENIED: Directory '${simpleName}' is strictly password-protected.\nType 'auth' to unlock.`);
          return;
        }
        currentDir = simpleName;
        printLine("dim", `[CD] Context switched to . (sub-scope active)`);
      } else {
        printLine("stderr", `Directory not found: '${target}'`);
      }
    } else {
      printLine("stderr", `Directory not found or cannot nest beyond current jail scope.`);
    }
  }

  // Strict CAT / TYPE Handler
  function handleCat(target) {
    if (!target) {
      printLine("stderr", "Usage: cat <filename>");
      return;
    }

    const clean = target.trim().replace(/^\.\//, "");

    // Anti-traversal check
    if (clean.includes("..") || clean.startsWith("/") || clean.startsWith("\\")) {
      printLine("stderr", "PERMISSION DENIED: Jail boundary violation. Path traversal blocked.");
      return;
    }

    // Check in active sub-scope
    if (currentDir !== "") {
      const subFiles = VFS["."].files[currentDir].files;
      if (subFiles[clean] && subFiles[clean].type === "file") {
        printLine("stdout", subFiles[clean].content);
        return;
      }
    }

    // Direct file in root
    if (VFS["."].files[clean] && VFS["."].files[clean].type === "file") {
      printLine("stdout", VFS["."].files[clean].content);
      return;
    }

    // Subdirectory search from root (e.g. cat projects/regime-portfolio-optimization.txt)
    const slashIdx = clean.indexOf("/");
    if (slashIdx !== -1) {
      const parentDir = clean.substring(0, slashIdx);
      const subFile = clean.substring(slashIdx + 1);

      if (VFS["."].files[parentDir] && VFS["."].files[parentDir].type === "dir") {
        if (VFS["."].files[parentDir].protected && !isElevated) {
          printLine("stderr", `ACCESS DENIED: Directory '${parentDir}' is strictly password-protected.\nType 'auth' to unlock.`);
          return;
        }

        const subObj = VFS["."].files[parentDir].files[subFile];
        if (subObj && subObj.type === "file") {
          printLine("stdout", subObj.content);
          return;
        }
      }
    }

    // Check if user is trying to access protected directory
    if (VFS["."].files[clean] && VFS["."].files[clean].protected) {
      printLine("stderr", `ACCESS DENIED: '${clean}' is a protected directory. Cannot cat a directory.`);
      return;
    }

    printLine("stderr", `File not found: '${target}'`);
  }

  // Nerdy Tree Generator
  function renderTree() {
    let out = ".\n";
    const entries = Object.entries(VFS["."].files);
    entries.forEach(([name, meta], idx) => {
      const isLast = idx === entries.length - 1;
      const branch = isLast ? "└── " : "├── ";
      const prefix = isLast ? "    " : "│   ";

      if (meta.type === "dir") {
        out += `${branch}${name}/\n`;
        if (meta.files) {
          const subEntries = Object.entries(meta.files);
          subEntries.forEach(([sName, sMeta], sIdx) => {
            const sLast = sIdx === subEntries.length - 1;
            const sBranch = sLast ? "└── " : "├── ";
            out += `${prefix}${sBranch}${sName}\n`;
          });
        }
      } else {
        out += `${branch}${name}\n`;
      }
    });
    printLine("stdout", out);
  }

  // Nerdy Grep Search
  function handleGrepCommand(args) {
    if (!args || args.length === 0) {
      printLine("stderr", "Usage: grep <pattern>\nExample: grep HyperMPC\nExample: grep Black-Scholes");
      return;
    }
    const pattern = args.join(" ").toLowerCase();
    let matches = [];

    // Search root files
    for (const [name, meta] of Object.entries(VFS["."].files)) {
      if (meta.type === "file" && meta.content) {
        const lines = meta.content.split("\n");
        lines.forEach((line, lIdx) => {
          if (line.toLowerCase().includes(pattern)) {
            matches.push(`./${name}:${lIdx + 1}: ${line.trim()}`);
          }
        });
      } else if (meta.type === "dir" && meta.files && (!meta.protected || isElevated)) {
        for (const [subName, subMeta] of Object.entries(meta.files)) {
          if (subMeta.type === "file" && subMeta.content) {
            const lines = subMeta.content.split("\n");
            lines.forEach((line, lIdx) => {
              if (line.toLowerCase().includes(pattern)) {
                matches.push(`./${name}/${subName}:${lIdx + 1}: ${line.trim()}`);
              }
            });
          }
        }
      }
    }

    if (matches.length > 0) {
      printLine("success", `Found ${matches.length} match${matches.length > 1 ? "es" : ""} for '${pattern}':`);
      printLine("stdout", matches.slice(0, 30).join("\n"));
      if (matches.length > 30) {
        printLine("dim", `... and ${matches.length - 30} more matches.`);
      }
    } else {
      printLine("dim", `No matches found for pattern: '${pattern}'`);
    }
  }

    if (!expr) {

      return;
    }

  // Isolated JavaScript Sandbox Execution
  function handleJsExecution(code) {
    if (!code) {
      printLine("stderr", "Usage: js <javascript code>\nExample: js [1, 2, 3].map(x => x * 10)");
      return;
    }

    const callId = "call_" + Math.random().toString(36).substring(2, 9);
    let timedOut = false;

    // Watchdog Timer (1000ms strict limit to kill infinite loops)
    const timer = setTimeout(() => {
      timedOut = true;
      window.removeEventListener("message", onMessage);
      printLine("stderr", "[EXECUTION TIMEOUT] Execution exceeded 1000ms threshold. Execution aborted.");
    }, 1000);

    function onMessage(e) {
      if (!e.data || e.data.id !== callId) return;
      clearTimeout(timer);
      window.removeEventListener("message", onMessage);
      if (timedOut) return;

      // Print any console logs captured
      if (e.data.logs && e.data.logs.length > 0) {
        e.data.logs.forEach(l => {
          printLine(l.type === "error" ? "stderr" : (l.type === "warn" ? "warn" : "stdout"), l.text);
        });
      }

      if (e.data.success) {
        if (e.data.result !== undefined) {
          printLine("success", "=> " + e.data.result);
        }
      } else {
        printLine("stderr", "Runtime Error: " + e.data.error);
      }
    }

    window.addEventListener("message", onMessage);

    try {
      sandboxFrame.contentWindow.postMessage({ id: callId, code: code }, "*");
    } catch(err) {
      clearTimeout(timer);
      window.removeEventListener("message", onMessage);
      printLine("stderr", "Sandbox Dispatch Error: " + err.message);
    }
  }

    let frames = 0;
    const interval = setInterval(() => {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00e699";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }

  function startSnakeGame() {
    if (snakeActive) return;
    snakeActive = true;
    const width = 22;
    const height = 10;
    snakeState = {
      w: width,
      h: height,
      snake: [{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}],
      dir: {x: 1, y: 0},
      food: {x: 12, y: 5},
      score: 0
    };

    printLine("success", "[ASCII SNAKE STARTED] Controls: W/A/S/D or Arrow Keys. Press 'Q' or Ctrl+C to quit.");
    const gameDiv = document.createElement("div");
    gameDiv.className = "term-line stdout";
    gameDiv.id = "snake-game-board";
    termOutput.appendChild(gameDiv);

    function placeFood() {
      while (true) {
        const fx = Math.floor(Math.random() * (width - 2)) + 1;
        const fy = Math.floor(Math.random() * (height - 2)) + 1;
        if (!snakeState.snake.some(s => s.x === fx && s.y === fy)) {
          snakeState.food = {x: fx, y: fy};
          break;
        }
      }
    }

    function renderBoard() {
      let out = "+" + "-".repeat(width - 2) + "+\n";
      for (let y = 1; y < height - 1; y++) {
        out += "|";
        for (let x = 1; x < width - 2; x++) {
          if (snakeState.snake[0].x === x && snakeState.snake[0].y === y) {
            out += "O";
          } else if (snakeState.snake.some(s => s.x === x && s.y === y)) {
            out += "■";
          } else if (snakeState.food.x === x && snakeState.food.y === y) {
            out += "★";
          } else {
            out += " ";
          }
        }
        out += "|\n";
      }
      out += "+" + "-".repeat(width - 2) + "+\n";
      out += ` Score: ${snakeState.score} | Length: ${snakeState.snake.length} | [W/A/S/D or Arrows] [Q: Exit]`;
      gameDiv.textContent = out;
      termScreen.scrollTop = termScreen.scrollHeight;
    }

    renderBoard();

    snakeInterval = setInterval(() => {
      if (!snakeActive) return;
      const head = {
        x: snakeState.snake[0].x + snakeState.dir.x,
        y: snakeState.snake[0].y + snakeState.dir.y
      };

      // Collision with wall
      if (head.x <= 0 || head.x >= width - 2 || head.y <= 0 || head.y >= height - 1) {
        stopSnakeGame("Collision with wall!");
        return;
      }

      // Collision with self
      if (snakeState.snake.some(s => s.x === head.x && s.y === head.y)) {
        stopSnakeGame("Collision with self!");
        return;
      }

      snakeState.snake.unshift(head);

      // Check food
      if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
        snakeState.score += 10;
        placeFood();
      } else {
        snakeState.snake.pop();
      }

      renderBoard();
    }, 140);
  }

  function updateTradePrice() {
    // Geometric Brownian Motion step
    const drift = 0.0005;
    const vol = 0.012;
    const shock = (Math.random() - 0.49) * 2;
    const ret = drift + vol * shock;
    tradeState.price = Math.max(1000, tradeState.price * (1 + ret));
    tradeState.history.push(tradeState.price);
    if (tradeState.history.length > 20) tradeState.history.shift();
  }

  function handleTradeCommand(args) {
    const sub = (args[0] || "status").toLowerCase();

    if (sub === "buy") {
      const qty = parseFloat(args[1]);
      if (isNaN(qty) || qty <= 0) {
        printLine("stderr", "Usage: trade buy <quantity>\nExample: trade buy 0.5");
        return;
      }
      updateTradePrice();
      const cost = qty * tradeState.price;
      if (cost > tradeState.cash) {
        printLine("stderr", `INSUFFICIENT FUNDS: Need $${cost.toFixed(2)}, available cash is $${tradeState.cash.toFixed(2)}.`);
        return;
      }
      tradeState.cash -= cost;
      tradeState.btc += qty;
      printLine("success", `[ORDER FILLED] Bought ${qty} BTC @ $${tradeState.price.toFixed(2)} | Cost: $${cost.toFixed(2)}`);
      showTradeStatus();
    } else if (sub === "sell") {
      const qty = parseFloat(args[1]);
      if (isNaN(qty) || qty <= 0) {
        printLine("stderr", "Usage: trade sell <quantity>\nExample: trade sell 0.5");
        return;
      }
      updateTradePrice();
      if (qty > tradeState.btc) {
        printLine("stderr", `INSUFFICIENT POSITION: Trying to sell ${qty} BTC, but holding ${tradeState.btc.toFixed(4)} BTC.`);
        return;

      const proceeds = qty * tradeState.price;
      tradeState.btc -= qty;

      printLine("success", `[ORDER FILLED] Sold ${qty} BTC @ $${tradeState.price.toFixed(2)} | Proceeds: $${proceeds.toFixed(2)}`);

    } else if (sub === "chart") {
      updateTradePrice();

    } else if (sub === "tick") {
      updateTradePrice();
      printLine("dim", `[MARKET TICK] Spot price updated to $${tradeState.price.toFixed(2)}`);

    } else if (sub === "reset") {

        e.preventDefault();
        if (snakeState.dir.x === 0) snakeState.dir = {x: -1, y: 0};
      } else if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        e.preventDefault();
        if (snakeState.dir.x === 0) snakeState.dir = {x: 1, y: 0};
      } else if (e.key.toLowerCase() === "q" || (e.ctrlKey && e.key.toLowerCase() === "c")) {
        e.preventDefault();
        stopSnakeGame("Exited by user.");
      }
      return;
    }

    if (e.key === "Enter") {
      e.preventDefault();
      const val = termRealInput.value;
      termRealInput.value = "";
      termInputDisplay.textContent = "";
      handleCommand(val);
      updatePrompt();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (commandHistory.length > 0 && historyIndex > 0) {
        historyIndex--;
        termRealInput.value = commandHistory[historyIndex];
        termInputDisplay.textContent = termRealInput.value;
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex < commandHistory.length - 1) {
        historyIndex++;
        termRealInput.value = commandHistory[historyIndex];
        termInputDisplay.textContent = termRealInput.value;
      } else {
        historyIndex = commandHistory.length;
        termRealInput.value = "";
        termInputDisplay.textContent = "";
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      handleTabCompletion();
    } else if (e.ctrlKey && e.key.toLowerCase() === "l") {
      e.preventDefault();
      clearTerminal();
    } else if (e.ctrlKey && e.key.toLowerCase() === "c") {
      e.preventDefault();
      printLine("cmd-echo", `${termPrompt.innerText} ${termRealInput.value}^C`);
      termRealInput.value = "";
      termInputDisplay.textContent = "";
      if (isPasswordPrompt) {
        isPasswordPrompt = false;
        termRealInput.type = "text";
        updatePrompt();
      }
    }
  });

  // Tab Completion
  function handleTabCompletion() {
    const val = termRealInput.value;
    const parts = val.split(" ");
    if (parts.length === 1) {
      const candidates = [
        "help", "ls", "dir", "pwd", "cd", "cat", "type", "clear", "cls", "calc", "js",
        "whoami", "auth", "theme", "mode", "date", "history", "matrix",
        "tree", "grep", "stat", "wc", "head", "tail", "site",
        "projects", "experience", "research", "scholastic", "skills", "resume", "metrics",
        "snake", "trade", "guess", "trivia", "browse", "browser", "curl", "ping", "dns",
        "nslookup", "netstat", "fortune", "quote", "cowsay", "exit"
      ];
      const match = candidates.filter(c => c.startsWith(parts[0].toLowerCase()));
      if (match.length === 1) {
        termRealInput.value = match[0] + " ";
        termInputDisplay.textContent = termRealInput.value;
      }
    } else if (parts.length === 2 && (parts[0] === "cat" || parts[0] === "cd" || parts[0] === "type" || parts[0] === "ls" || parts[0] === "stat" || parts[0] === "wc" || parts[0] === "head" || parts[0] === "tail")) {
      const activeObj = currentDir ? VFS["."].files[currentDir].files : VFS["."].files;
      const fileCandidates = Object.keys(activeObj);
      const partial = parts[1].replace(/^\.\//, "").toLowerCase();
      const match = fileCandidates.filter(f => f.toLowerCase().startsWith(partial));
      if (match.length === 1) {
        const isDir = activeObj[match[0]].type === "dir";
        termRealInput.value = parts[0] + " " + match[0] + (isDir ? "/" : "");
        termInputDisplay.textContent = termRealInput.value;
      }
    }
  }

  // Initialize
  printBanner();
  updatePrompt();
  focusTerminalInput();
})();
</script>
